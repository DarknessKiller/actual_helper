version: '3'

tasks:
  fmt:
    desc: "Format Go code with gofmt and goimports"
    cmds:
      - go tool golangci-lint fmt
  lint:
    desc: "Lint Go code, test files included"
    cmds:
      - go tool golangci-lint run
  test:
    desc: "Run the Go test suite"
    cmds:
      - CGO_ENABLED=0 go test ./...
  release:
    desc: "Get next version, tag, and push"
    cmds:
      - |
        CURRENT=$(go tool svu --prefix v current)
        NEXT=$(go tool svu --prefix v next)
        echo "Current: $CURRENT"
        echo "Next: $NEXT"
        git tag -a "$NEXT" -m "Release $NEXT"
        git push origin main --tags
        echo "Released $NEXT"

  current:
    desc: "Show current version"
    cmds:
      - go tool svu --prefix v current

  next:
    desc: "Show next version"
    cmds:
      - go tool svu --prefix v next
